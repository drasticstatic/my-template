name: 🌐 Sync Public Preview (Exclude List Model)

# EXCLUDE LIST MODEL — open, everything public by default.
# All paths are synced EXCEPT those listed in the filter-repo step.
# Use this model when most of your repo is public and you have
# a small set of private files/dirs to strip.
#
# Example repos using DENYLIST logic (this template):
# - trading-assistant
# - pir-devine-news
# - wilson-lawn-ai-assist
# - dpnelson
#
# Example repos using ALLOWLIST logic (sync-public-allowlist.yml):
# - divorce-custody-assistant
# - anthropas-argus-alfred
# - trading-bot_arbitrage_DAPPUv3_hardhat_UNI-CAKE
#
# .nojekyll: Store in my-template repo until needed. Only add when Jekyll processing
# interferes with content (files with underscores, certain directory names, etc.).
# React/Vite sites don't need it. Add on as-needed basis.
#
# See also: sync-public-allowlist.yml for the strict (closed) model.
#
# ── GOTCHAS (excludelist / denylist model) ─────────────────────────────────────
# 1. SILENT LEAK RISK (no tripwire here): there is NO validate step in this
#    model — everything is public unless you --path it into the strip list. So a
#    NEW private root file/dir you add will LEAK to the public repo until you add
#    it to the filter-repo --path list. Audit the root tree on every new entry.
#    (The allowlist model fails-safe by blocking; this model fails-open by
#    leaking. Mirror inverse.) Real-world: trading-assistant strips strategies/,
#    taxes/, tradingview/, "MCP Servers/", logs/ — anything new of comparable
#    sensitivity must be added too.
# 2. EMPTY-COMMIT PRUNING: git filter-repo drops commits that become empty after
#    --invert-paths strips their private paths. So a commit touching ONLY private
#    paths will NOT appear on the public HEAD — correct, not a failure. "Success"
#    = sync green + public HEAD reflects the latest PUBLIC-touching commit.
# 3. PAT `workflow` SCOPE: classic `PUBLIC_REPO_TOKEN` must have `workflow` scope
#    (not just `repo`) IF this sync injects/updates a `.github/workflows/` file in
#    the public repo — otherwise push 403s ("refusing to allow a PAT to create
#    or update workflow files without workflow scope"). Adding `workflow` later =
#    edit the existing token at github.com/settings/tokens; value unchanged, no
#    need to re-set the secret. See ~/code/drasticstatic/how-to-setup-GITEXPORTER.md
#    (Step 1) + PAT table. See also: ~/code/anthropas-argus-alfred/REPO-RESURRECTION-PLAYBOOK.md.
# 4. THE PUBLIC-LANE TRIPWIRE (2026-11-01) closes gotcha 1's silent leak at the file level: after filter-repo,
#    scripts/scan-public-lane.sh (master: my-template/scripts/) reads every file at HEAD AND every version in the
#    rewritten history, exactly as in sync-public-allowlist.yml (its gotcha 4). A new private file that slipped past
#    the strip list still has to pass it: credentials and agent-note pointers are refused outright; sensitive shapes,
#    unread PDFs, pictures outside assets/ or icons/ and other binaries need a person's line in
#    PUBLIC-ALLOWLIST-ATTESTED.txt. It does not replace the strip list: a harmless-looking private file still leaks.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repo (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-filter-repo and pdftotext (the public-lane tripwire reads every PDF)
        run: |
          pip install git-filter-repo
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          pdftotext -v 2>&1 | head -1

      - name: Keep the tripwire outside the tree filter-repo rewrites
        run: |
          set -eu
          [ -f scripts/scan-public-lane.sh ] || { echo "::error::scripts/scan-public-lane.sh is missing; copy it from my-template/scripts/ (no reader, no sync)"; exit 1; }
          cp scripts/scan-public-lane.sh scripts/scan-public-lane.selftest.sh "$RUNNER_TEMP/"
          if [ -f PUBLIC-ALLOWLIST-ATTESTED.txt ]; then cp PUBLIC-ALLOWLIST-ATTESTED.txt "$RUNNER_TEMP/attested.txt"; else : > "$RUNNER_TEMP/attested.txt"; fi
          sh "$RUNNER_TEMP/scan-public-lane.selftest.sh"

      - name: Strip private content
        run: |
          # ── LIST EVERY PRIVATE PATH TO STRIP ─────────────────────────────
          # Each --path names something to REMOVE (used with --invert-paths).
          # Add more --path lines for any additional private files/dirs.
          git filter-repo \
            --path "CLAUDE.md" \
            --path "AGENTS.md" \
            --path "AGENTS.override.md" \
            --path ".augmentignore" \
            --path ".gitignore" \
            --path ".graphifyignore" \
            --path ".github/" \
            --path "AGENT-SYNC/" \
            --path "specs/" \
            --path "gitexporter.config.json" \
            --path "logs/" \
            --path "strategies/" \
            --path "graphify-out/" \
            --invert-paths \
            --filename-callback 'return None if filename is None or (filename.startswith(b".claude/") and not filename.startswith(b".claude/skills/")) else filename' \
            --force

      - name: Public-lane tripwire (every file at HEAD and every version in history is read, or attested, or refused)
        run: |
          # a public lane never publishes a file a machine or a person has not read (master: my-template/scripts/scan-public-lane.sh)
          set -eu
          scan="$RUNNER_TEMP/scan-public-lane.sh"; att="$RUNNER_TEMP/attested.txt"
          # HEAD exactly as committed (not the working tree, which may hold leftovers filter-repo untracked)
          head="$RUNNER_TEMP/head"; rm -rf "$head"; mkdir -p "$head"
          git --work-tree="$head" checkout -f HEAD -- .
          sh "$scan" "$head" "$att"
          # legal lanes by path, in any commit that will be published
          if git log --all --format= --name-only | grep -Eiq '(^|/)(entity|tax|filings|counsel)/'; then
            echo "::error::a legal lane (entity/ tax/ filings/ counsel/) appears in the history about to be published"; exit 1
          fi
          # every blob the rewritten history carries, laid out as <blob>/<path>; --strip 1 applies the rules to <path>
          hist="$RUNNER_TEMP/history"; rm -rf "$hist"; mkdir -p "$hist"
          git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectname) %(rest)' |
            awk '$1 == "blob" && $3 != ""' | while read -r _type sha p; do
              mkdir -p "$hist/$sha/$(dirname "$p")"
              git cat-file blob "$sha" > "$hist/$sha/$p"
            done
          sh "$scan" --strip 1 "$hist" "$att"

      - name: Configure Git Identity
        run: |
          git config user.name "Public Mirror Bot"
          git config user.email "actions@github.com"

      - name: Push to Public Repo
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # ── REPLACE with your public repo: OWNER/REPO ─────────────────────
          git remote add origin https://x-access-token:${TOKEN}@github.com/YOUR_USERNAME/YOUR_PUBLIC_REPO.git
          git push origin main --force
