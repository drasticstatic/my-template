name: 🌐 Sync Public Preview (Allowlist Model)

# ALLOWLIST MODEL — strict, everything private by default.
# Only paths named in public_allowlist are synced to the public repo.
# Any new root-level path not in either list will fail CI until classified.
# Use this model when most of your repo is private.
#
# Example repos using ALLOWLIST logic:
# - divorce-custody-assistant
# - anthropas-argus-alfred
# - trading-bot_arbitrage_DAPPUv3_hardhat_UNI-CAKE
# - gratitude-token-project_astro (added 2026-09-01, syncs to gratitude-token-project_astro-public)
#
# Example repos using DENYLIST logic (sync-public-excludelist.yml):
# - trading-assistant
# - pir-devine-news
# - wilson-lawn-ai-assist
# - dpnelson
#
# .nojekyll: Store in my-template repo until needed. Only add when Jekyll processing
# interferes with content (files with underscores, certain directory names, etc.).
# React/Vite sites don't need it. Add on as-needed basis.
#
# See also: sync-public-excludelist.yml for the inverse (open) model.
#
# ── GOTCHAS (allowlist / validate-step model) ─────────────────────────────────
# 1. VALIDATE TRIPWIRE: the "Validate + filter private content" step FAILS the
#    build if ANY root-level path is on neither public_allowlist nor
#    private_allowlist. So when you add a new root file/dir, classify it in the
#    matching list IN THE SAME COMMIT — or the next push's sync breaks. (This is
#    exactly what stalled anthropas-argus-alfred on 2026-07-03: `memory/` +
#    `index copy 2.html` were unclassified.) Reflex: new root entry → one-line
#    allowlist addition in the same commit.
# 1b. SINGLE SOURCE OF TRUTH: earlier versions of this template had the validation
#    check and the actual `git filter-repo --path` strip list as two SEPARATE
#    hand-maintained lists — easy to update one and forget the other, which is
#    exactly what leaked `.graphifyignore` and a private planning doc to
#    littlebird-ambassador-public-preview and augment-intent-properties-public-preview
#    on 2026-09-02 (private_allowlist got a new entry, the filter-repo --path list
#    didn't). Fixed by generating the --path args FROM private_allowlist
#    programmatically in the same step — there is now only one list to edit.
# 2. EMPTY-COMMIT PRUNING: git filter-repo drops commits that become empty after
#    filter-repo strips their private paths. So a commit touching ONLY private
#    paths will NOT appear on the public HEAD — and that's correct, not a
#    failure. "Success" = sync green + public HEAD reflects the latest
#    PUBLIC-touching commit. (For a compliance/audit narrative this is desirable:
#    only genuine public content surfaces on the record.)
# 3. PAT `workflow` SCOPE: the classic `PUBLIC_REPO_TOKEN` must have `workflow`
#    scope (not just `repo`) IF this sync injects/updates a `.github/workflows/`
#    file in the public repo — otherwise push 403s with "refusing to allow a PAT
#    to create or update workflow files without workflow scope". Adding
#    `workflow` later = edit the existing token at github.com/settings/tokens;
#    the token value does NOT change, so no need to re-set the secret. See
#    ~/code/drasticstatic/how-to-setup-GITEXPORTER.md (Step 1) + PAT table.
#    See also: ~/code/anthropas-argus-alfred/REPO-RESURRECTION-PLAYBOOK.md.
# 4. THE PUBLIC-LANE TRIPWIRE (2026-11-01): a public lane never publishes a file a
#    machine or a person has not read. After filter-repo, scripts/scan-public-lane.sh
#    (master: my-template/scripts/) reads every file at HEAD AND every version in the
#    rewritten history (this model publishes history): text is scanned for
#    credentials, agent-note pointers and sensitive shapes; PDFs through pdftotext;
#    .docx/.xlsx through their XML. A scan or image-only PDF, a picture outside
#    assets/, icons/ and the folders in PUBLIC-LANE-MEDIA.txt ("approved by <name> |
#    YYYY-MM-DD" above each folder: a person chose them, a machine still reads what it
#    can), or any other binary is refused unless a person attested it in
#    PUBLIC-ALLOWLIST-ATTESTED.txt ("path | officer | YYYY-MM-DD | opened and read");
#    entity/ tax/ filings/ counsel/ are refused by path, in any commit.
#    The scanner and both lists are copied out BEFORE filter-repo, so they may stay
#    private. Earlier sync versions read only plain text and passed PDFs unread (the
#    plugin's Nov 1 heads-up).

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repo (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-filter-repo and pdftotext (the tripwire reads every PDF)
        run: |
          pip install git-filter-repo
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          pdftotext -v 2>&1 | head -1

      - name: Keep the tripwire outside the tree filter-repo rewrites
        run: |
          set -eu
          [ -f scripts/scan-public-lane.sh ] || { echo "::error::scripts/scan-public-lane.sh is missing; copy it from my-template/scripts/ (no reader, no sync)"; exit 1; }
          cp scripts/scan-public-lane.sh scripts/scan-public-lane.selftest.sh "$RUNNER_TEMP/"
          if [ -f PUBLIC-ALLOWLIST-ATTESTED.txt ]; then cp PUBLIC-ALLOWLIST-ATTESTED.txt "$RUNNER_TEMP/attested.txt"; else : > "$RUNNER_TEMP/attested.txt"; fi
          if [ -f PUBLIC-LANE-MEDIA.txt ]; then cp PUBLIC-LANE-MEDIA.txt "$RUNNER_TEMP/media.txt"; else : > "$RUNNER_TEMP/media.txt"; fi
          sh "$RUNNER_TEMP/scan-public-lane.selftest.sh"

      - name: Validate + filter private content
        shell: bash
        run: |
          set -euo pipefail

          # ── ADD YOUR PUBLIC FILES/DIRS HERE ──────────────────────────────
          public_allowlist=(
            "README.md"
            "index.html"
            "LICENSE"
            "CONTRIBUTING.md"
            "SECURITY.md"
            # "docs"
            # "examples"
          )

          # ── ADD YOUR PRIVATE FILES/DIRS HERE ─────────────────────────────
          # Single source of truth: this SAME array drives both the validation
          # tripwire below AND the git filter-repo --path strip list — no
          # second list to keep in sync. .claude is listed here for validation
          # purposes but excluded from the auto-generated --path args below
          # since it's handled separately by --filename-callback (strips
          # .claude/ except .claude/skills/, which stays public).
          private_allowlist=(
            ".augmentignore"
            ".cosmosignore"
            ".claude"
            ".github"
            ".gitignore"
            ".graphifyignore"
            "graphify-out"
            "CLAUDE.md"
            "AGENT-SYNC"
            "gitexporter.config.json"
            "specs"
            "PUBLIC-ALLOWLIST-ATTESTED.txt"  # the tripwire's attestations (copied out before filter-repo)
            "PUBLIC-LANE-MEDIA.txt"  # the tripwire's media list (copied out before filter-repo)
            # "scripts"  # holds scan-public-lane.sh: classify it here or in public_allowlist, or validation stops
            # Add more private dirs/files here
          )

          is_listed() {
            local entry="$1"
            shift
            for item in "$@"; do
              if [[ "$item" == "$entry" ]]; then return 0; fi
            done
            return 1
          }

          unclassified=()
          while IFS= read -r entry; do
            if [[ "$entry" == ".git" ]]; then continue; fi
            if is_listed "$entry" "${public_allowlist[@]}"; then continue; fi
            if is_listed "$entry" "${private_allowlist[@]}"; then continue; fi
            unclassified+=("$entry")
          done < <(find . -maxdepth 1 -mindepth 1 | sed 's|^\./||' | sort)

          if ((${#unclassified[@]} > 0)); then
            echo "Unclassified root paths — add to public_allowlist or private_allowlist:"
            printf ' - %s\n' "${unclassified[@]}"
            exit 1
          fi

          # ── Build git filter-repo --path args FROM private_allowlist ─────
          filter_args=()
          for entry in "${private_allowlist[@]}"; do
            if [[ "$entry" == ".claude" ]]; then continue; fi  # handled by --filename-callback below
            if [[ -d "$entry" ]]; then
              filter_args+=(--path "${entry}/")
            else
              filter_args+=(--path "$entry")
            fi
          done

          git filter-repo \
            "${filter_args[@]}" \
            --invert-paths \
            --filename-callback 'return None if filename is None or (filename.startswith(b".claude/") and not filename.startswith(b".claude/skills/")) else filename' \
            --force

      - name: Public-lane tripwire (every file at HEAD and every version in history is read, or attested, or refused)
        run: |
          set -eu
          scan="$RUNNER_TEMP/scan-public-lane.sh"; att="$RUNNER_TEMP/attested.txt"
          # HEAD exactly as committed (not the working tree, which may hold leftovers filter-repo untracked)
          head="$RUNNER_TEMP/head"; rm -rf "$head"; mkdir -p "$head"
          git --work-tree="$head" checkout -f HEAD -- .
          sh "$scan" --media "$RUNNER_TEMP/media.txt" "$head" "$att"
          # legal lanes by path, in any commit that will be published
          if git log --all --format= --name-only | grep -Eiq '(^|/)(entity|tax|filings|counsel)/'; then
            echo "::error::a legal lane (entity/ tax/ filings/ counsel/) appears in the history about to be published"; exit 1
          fi
          # every blob the rewritten history carries, laid out as <blob>/<path>; --strip 1 applies the rules to <path>
          hist="$RUNNER_TEMP/history"; rm -rf "$hist"; mkdir -p "$hist"
          git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectname) %(rest)' |
            awk '$1 == "blob" && $3 != ""' | while read -r _type sha p; do
              mkdir -p "$hist/$sha/$(dirname "$p")"
              git cat-file blob "$sha" > "$hist/$sha/$p"
            done
          sh "$scan" --strip 1 --media "$RUNNER_TEMP/media.txt" "$hist" "$att"

      - name: Configure Git Identity
        run: |
          git config user.name "Public Mirror Bot"
          git config user.email "actions@github.com"

      - name: Push to Public Repo
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # ── REPLACE with your public repo: OWNER/REPO ─────────────────────
          git remote add origin https://x-access-token:${TOKEN}@github.com/YOUR_USERNAME/YOUR_PUBLIC_REPO.git
          git push origin main --force
