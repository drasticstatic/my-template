    <text x="530" y="232" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#d9d3dc">a pull request; a</text><text x="530" y="252" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#d9d3dc">person presses merge</text>
    <g transform="translate(711.0 75.0) scale(0.1641)" fill="#fbeef1"><path d="M104,56A24,24,0,1,1,80,32,24,24,0,0,1,104,56Z" opacity="0.2"/><path d="M208,112a32.05,32.05,0,0,0-30.69,23l-42.21-6a8,8,0,0,1-4.95-2.71L94.43,84.55A32,32,0,1,0,72,87v82a32,32,0,1,0,16,0V101.63l30,35a24,24,0,0,0,14.83,8.14l44,6.28A32,32,0,1,0,208,112ZM64,56A16,16,0,1,1,80,72,16,16,0,0,1,64,56ZM96,200a16,16,0,1,1-16-16A16,16,0,0,1,96,200Zm112-40a16,16,0,1,1,16-16A16,16,0,0,1,208,160Z"/></g>
