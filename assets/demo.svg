<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">How a change travels</title>
  <desc id="d">One change walks five stops: a draft on a working branch, a rendered preview, a Promote that a person merges, main, and the public twin. Between main and the twin a tripwire reads every file, lights up, lets the change through and holds back one file it refuses. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less; outside this block everything is in its finished state.
       Five passes, about ninety seconds, then it rests on the finished picture, so it does not warm anyone's laptop. */
    @media (prefers-reduced-motion: no-preference) {
      .travel { animation: travel 18s linear 5 both; }
      .tokenfade { animation: fadein 18s linear 5 both; }
      .road { stroke-dasharray: 948; animation: road 18s linear 5 both; }
      .lit0 { animation: lit0 18s linear 5 both; }
      .lit1 { animation: lit1 18s linear 5 both; }
      .lit2 { animation: lit2 18s linear 5 both; }
      .lit3 { animation: lit3 18s linear 5 both; }
      .lit4 { animation: lit4 18s linear 5 both; }
      .press { transform-box: fill-box; transform-origin: center; animation: press 18s linear 5 both; }
      .wire { animation: wire 18s linear 5 both; }
      .scan { animation: scan 18s linear 5 both; }
      .heldgo { animation: heldgo 18s linear 5 both; }
      .heldfade { animation: heldfade 18s linear 5 both; }
      .late { animation: late 18s linear 5 both; }
      .done { animation: done 18s linear 5 both; }
    }
    @keyframes travel { 0% { transform: translateX(-948px) } 10% { transform: translateX(-948px) } 16% { transform: translateX(-746px) } 26% { transform: translateX(-746px) } 32% { transform: translateX(-544px) } 42% { transform: translateX(-544px) } 48% { transform: translateX(-342px) } 54% { transform: translateX(-342px) } 60% { transform: translateX(-171px) } 68% { transform: translateX(-171px) } 74% { transform: translateX(0px) } 100% { transform: translateX(0px) } }
    @keyframes fadein { 0% { opacity: 0 } 3% { opacity: 1 } 100% { opacity: 1 } }
    @keyframes road { 0% { stroke-dashoffset: 948 } 10% { stroke-dashoffset: 948 } 16% { stroke-dashoffset: 746 } 26% { stroke-dashoffset: 746 } 32% { stroke-dashoffset: 544 } 42% { stroke-dashoffset: 544 } 48% { stroke-dashoffset: 342 } 54% { stroke-dashoffset: 342 } 60% { stroke-dashoffset: 171 } 68% { stroke-dashoffset: 171 } 74% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0 } }
    @keyframes lit0 { 0% { opacity: 0 } 2.99% { opacity: 0 } 4.5% { opacity: 1 } 100% { opacity: 1 } }
    @keyframes lit1 { 0% { opacity: 0 } 15.99% { opacity: 0 } 17.5% { opacity: 1 } 100% { opacity: 1 } }
    @keyframes lit2 { 0% { opacity: 0 } 31.99% { opacity: 0 } 33.5% { opacity: 1 } 100% { opacity: 1 } }
    @keyframes lit3 { 0% { opacity: 0 } 47.99% { opacity: 0 } 49.5% { opacity: 1 } 100% { opacity: 1 } }
    @keyframes lit4 { 0% { opacity: 0 } 73.99% { opacity: 0 } 75.5% { opacity: 1 } 100% { opacity: 1 } }
    @keyframes press { 0%,33% { opacity: 0; transform: scale(.7) } 36% { opacity: 1; transform: scale(1) } 41% { opacity: 0; transform: scale(1.5) } 100% { opacity: 0; transform: scale(1.5) } }
    @keyframes wire { 0%,57% { opacity: 0 } 59% { opacity: 1 } 62% { opacity: .55 } 64% { opacity: 1 } 100% { opacity: 1 } }
    @keyframes scan { 0%,57% { opacity: 0; transform: translateY(0) } 58% { opacity: 1; transform: translateY(0) } 61.5% { opacity: 1; transform: translateY(136px) } 65% { opacity: 1; transform: translateY(0) } 68% { opacity: 1; transform: translateY(136px) } 68.5%,100% { opacity: 0; transform: translateY(136px) } }
    @keyframes heldgo { 0%,54% { transform: translateX(-157px) } 59% { transform: translateX(0) } 100% { transform: translateX(0) } }
    @keyframes heldfade { 0%,53.5% { opacity: 0 } 55% { opacity: 1 } 100% { opacity: 1 } }
    @keyframes late { 0%,62% { opacity: 0 } 64% { opacity: 1 } 100% { opacity: 1 } }
    @keyframes done { 0%,75% { opacity: 0 } 78% { opacity: 1 } 100% { opacity: 1 } }
    .scan, .press { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#0f3460"/></linearGradient>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="903" cy="130" r="520"><stop offset="0" stop-color="#800020" stop-opacity=".62"/><stop offset=".6" stop-color="#5c1a2b" stop-opacity=".32"/><stop offset="1" stop-color="#5c1a2b" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="1200" height="330" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="330" fill="url(#ground)"/><rect width="1200" height="330" fill="url(#ember)"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="48" y="40" fill="#e3b4c0" font-size="15" font-weight="700" letter-spacing="2.4">HOW A CHANGE TRAVELS</text>
    <text x="318" y="40" fill="#d9d3dc" font-size="15">helpers do everything up to the merge; a person merges</text>
    </g>
