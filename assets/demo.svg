    <rect x="654.0" y="62" width="156" height="136" rx="14" fill="#12141f" fill-opacity=".72" stroke="#6d5e78" stroke-width="1.5"/>
    <rect class="lit3" x="654.0" y="62" width="156" height="136" rx="14" fill="#800020" stroke="#e3b4c0" stroke-width="2"/>
    <rect x="996.0" y="62" width="156" height="136" rx="14" fill="#12141f" fill-opacity=".72" stroke="#6d5e78" stroke-width="1.5"/>
    <rect class="lit4" x="996.0" y="62" width="156" height="136" rx="14" fill="#800020" stroke="#e3b4c0" stroke-width="2"/>
