    <text x="126" y="146" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fbeef1">Draft</text>
    <text x="126" y="232" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#d9d3dc">a helper writes,</text><text x="126" y="252" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#d9d3dc">on a working branch</text>
