    <text x="48" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#d9d3dc">Nothing reaches the public twin unread: a file the tripwire cannot read, or should not publish, stays home, and it says which.</text>
