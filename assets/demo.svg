    <text x="328" y="232" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#d9d3dc">rendered and read,</text><text x="328" y="252" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#d9d3dc">before anyone merges</text>
