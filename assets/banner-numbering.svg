    <circle class="arrive" style="animation-delay:1.35s" cx="697.7" cy="172.5" r="5.7" fill="#ddb5bf"/>
    <circle class="arrive" style="animation-delay:1.59s" cx="849.8" cy="59.9" r="3.4" fill="#ddb5bf"/>
    <circle class="arrive" style="animation-delay:1.83s" cx="864.5" cy="125.9" r="6.4" fill="#ddb5bf"/>
    <circle class="arrive" style="animation-delay:2.07s" cx="880.9" cy="202.9" r="4.0" fill="#ddb5bf"/>
    <circle class="arrive" style="animation-delay:2.31s" cx="966.0" cy="84.4" r="3.8" fill="#ddb5bf"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#1a1a2e"/><rect x="300.0" y="248" width="300.5" height="12" fill="#5c1a2b"/><rect x="600.0" y="248" width="300.5" height="12" fill="#800020"/><rect x="900.0" y="248" width="300.5" height="12" fill="#fbeef1"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#c78f9d" font-size="15" font-weight="700" letter-spacing=".6">THE FLEET'S STANDARD</text><text x="56" y="122.2" fill="#fbeef1" font-size="60" font-weight="700" letter-spacing="-.5">Numbering</text><text x="56" y="166.0" fill="#dcd0d6" font-size="23">A number is a name: it never changes and is never</text><text x="56" y="196.8" fill="#dcd0d6" font-size="23">used twice</text></g>
  </g>
</svg>
