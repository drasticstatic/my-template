    <path class="draw" pathLength="100" d="M936.5 141.5L864.5 125.9" fill="none" stroke="#614154" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.96s"/>
    <path class="draw" pathLength="100" d="M864.5 125.9L849.8 59.9" fill="none" stroke="#614154" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.18s"/>
    <path class="draw" pathLength="100" d="M849.8 59.9L788.7 93.9" fill="none" stroke="#614154" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.40s"/>
    <path class="draw" pathLength="100" d="M864.5 125.9L880.9 202.9" fill="none" stroke="#614154" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.62s"/>
    <path class="draw" pathLength="100" d="M880.9 202.9L798.2 199.4" fill="none" stroke="#614154" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.84s"/>
    <path class="draw" pathLength="100" d="M798.2 199.4L697.7 172.5" fill="none" stroke="#614154" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:2.06s"/>
    <circle class="arrive" style="animation-delay:0.15s" cx="1034.3" cy="54.0" r="8.0" fill="#b87082"/>
